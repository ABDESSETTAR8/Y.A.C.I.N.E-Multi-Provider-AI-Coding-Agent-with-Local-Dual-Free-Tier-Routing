<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Y.A.C.I.N.E avatar: man with short hair and glasses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#fcd9b8"/>
      <stop offset="1" stop-color="#e8b98a"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="196" fill="#ffffff" opacity="0.06"/>

  <!-- shoulders / torso -->
  <path d="M96 512 C96 412 168 360 256 360 C344 360 416 412 416 512 Z" fill="#0f172a"/>
  <path d="M196 372 C196 340 226 322 256 322 C286 322 316 340 316 372 L316 400 L196 400 Z" fill="#1e293b"/>

  <!-- neck -->
  <rect x="232" y="300" width="48" height="60" rx="20" fill="#d99e72"/>

  <!-- head -->
  <ellipse cx="256" cy="220" rx="104" ry="116" fill="url(#face)"/>

  <!-- ears -->
  <ellipse cx="152" cy="226" rx="16" ry="24" fill="#e8b98a"/>
  <ellipse cx="360" cy="226" rx="16" ry="24" fill="#e8b98a"/>

  <!-- short hair (close crop) -->
  <path d="M150 210 C146 132 196 96 256 96 C316 96 366 132 362 210
           C352 168 320 150 300 150 C300 132 286 120 256 120
           C226 120 212 132 212 150 C192 150 160 168 150 210 Z"
        fill="#2b2b2b"/>
  <path d="M150 210 C168 188 196 178 212 176 L208 200 Z" fill="#1f1f1f"/>
  <path d="M362 210 C344 188 316 178 300 176 L304 200 Z" fill="#1f1f1f"/>

  <!-- eyebrows -->
  <rect x="196" y="196" width="44" height="9" rx="4.5" fill="#2b2b2b"/>
  <rect x="272" y="196" width="44" height="9" rx="4.5" fill="#2b2b2b"/>

  <!-- glasses -->
  <g stroke="#111827" stroke-width="9" fill="none" stroke-linejoin="round">
    <rect x="186" y="214" width="68" height="56" rx="20" fill="#dbeafe" fill-opacity="0.35"/>
    <rect x="258" y="214" width="68" height="56" rx="20" fill="#dbeafe" fill-opacity="0.35"/>
    <line x1="254" y1="240" x2="258" y2="240"/>
  </g>
  <circle cx="220" cy="242" r="7" fill="#1e3a8a" opacity="0.5"/>
  <circle cx="292" cy="242" r="7" fill="#1e3a8a" opacity="0.5"/>

  <!-- eyes -->
  <circle cx="220" cy="242" r="9" fill="#3b2a1a"/>
  <circle cx="292" cy="242" r="9" fill="#3b2a1a"/>

  <!-- nose -->
  <path d="M256 252 L246 290 Q256 300 266 290 Z" fill="#d99e72"/>

  <!-- mouth -->
  <path d="M222 304 Q256 330 290 304" stroke="#a8553a" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- subtle highlight -->
  <ellipse cx="210" cy="180" rx="22" ry="30" fill="#ffffff" opacity="0.12"/>
</svg>
